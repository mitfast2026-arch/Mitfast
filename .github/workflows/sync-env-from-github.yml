name: Sync Env From GitHub Secrets

# One-shot: write GitHub secrets to an artifact for local .env.local.
# Trigger manually, download artifact, then delete this workflow.

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Write local env file
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          set -euo pipefail
          test -n "${NEXT_PUBLIC_SUPABASE_URL}"
          test -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY}"
          {
            echo "# Generated by Sync Env From GitHub Secrets"
            echo "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "RESEND_API_KEY=${RESEND_API_KEY}"
            echo "BREVO_API_KEY=${BREVO_API_KEY}"
            echo "EMAIL_FROM=${EMAIL_FROM}"
          } > env-from-github.txt
          echo "URL_LEN=${#NEXT_PUBLIC_SUPABASE_URL}"
          echo "ANON_LEN=${#NEXT_PUBLIC_SUPABASE_ANON_KEY}"
          echo "SERVICE_LEN=${#SUPABASE_SERVICE_ROLE_KEY}"

      - name: Upload env artifact
        uses: actions/upload-artifact@v4
        with:
          name: env-from-github
          path: env-from-github.txt
          retention-days: 1
          overwrite: true
          include-hidden-files: true
